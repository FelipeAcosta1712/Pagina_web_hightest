<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portal de Cliente HIGH TEST SAS - Acceso a sus certificados y ensayos">
    <meta name="keywords" content="portal cliente, HIGH TEST, certificados, ensayos eléctricos">
    <meta name="author" content="HIGH TEST SAS">
    <meta name="theme-color" content="#10b981">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Cliente | HIGH TEST SAS</title>
    <link rel="stylesheet" href="../styles-v2.css">
</head>
<body class="bg-slate-50 font-sans text-slate-900 h-screen flex overflow-hidden">
    <!-- HEADER CLIENTE -->
    <header class="header header--client" role="banner">
        <div class="header__container">
            <div class="header__logo">
                <a href="/index.html#inicio" class="header__logo-link">
                    <img src="/image/logo.png" alt="HIGH TEST SAS" class="header__logo-image">
                </a>
            </div>
            <nav class="header__nav" role="navigation" aria-label="Navegación cliente">
                <button class="header__menu-toggle" id="clientMenuToggle" aria-label="Abrir menú" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul class="header__menu" id="clientHeaderMenu">
                    <li><a href="#certificates" class="header__link">Certificados</a></li>
                    <li><a href="#history" class="header__link">Historial</a></li>
                    <li><a href="#requests" class="header__link">Solicitudes</a></li>
                    <li><a href="#support" class="header__link">Soporte</a></li>
                    <!-- Acción especial menú móvil: salir -->
                    <li class="header__menu-item--action">
                        <button class="header__menu-btn header__menu-btn--secondary" id="clientLogoutMobileBtn" aria-label="Cerrar sesión">
                            🚪 Salir
                        </button>
                    </li>
                </ul>
                <button class="header__icon-btn" id="themeToggleBtn" aria-label="Cambiar tema de color" title="Cambiar tema">
                    🌙
                </button>
                <div class="header__user-info">
                    <span class="user-info__name" id="clientUserName">Cliente</span>
                    <span class="user-info__company" id="clientUserCompany">Empresa</span>
                </div>
                <button class="header__cta header__cta--logout" id="clientLogoutBtn" aria-label="Cerrar sesión">
                    🚪 Salir
                </button>
            </nav>
        </div>
    </header>

    <!-- Overlay para móvil -->
    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleMobileMenu(false)"></div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-50 w-64 bg-white border-r border-slate-200 transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-in-out flex flex-col">
        <div class="h-16 flex items-center px-6 border-b border-slate-200 shrink-0">
            <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center mr-3">
                <i data-lucide="activity" class="text-white w-5 h-5"></i>
            </div>
            <span class="text-xl font-bold text-slate-800 tracking-tight">LabPortal</span>
            <button class="ml-auto lg:hidden text-slate-400 hover:text-slate-600" onclick="toggleMobileMenu(false)">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="p-4 flex-1 overflow-y-auto">
            <div class="mb-4 text-xs font-semibold text-slate-400 uppercase tracking-wider px-4">Principal</div>
            
            <button onclick="setTab('dashboard')" class="nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors mb-1" data-id="dashboard">
                <i data-lucide="activity" class="nav-icon mr-3 w-5 h-5"></i> Panel Operativo
            </button>
            <button onclick="setTab('reports')" class="nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors mb-1" data-id="reports">
                <i data-lucide="download" class="nav-icon mr-3 w-5 h-5"></i> Informes de Ensayos
            </button>
            <button onclick="setTab('requests')" class="nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors mb-1" data-id="requests">
                <i data-lucide="clock" class="nav-icon mr-3 w-5 h-5"></i> Estado de Solicitudes
            </button>
            
            <div class="mt-8 mb-4 text-xs font-semibold text-slate-400 uppercase tracking-wider px-4">Administración</div>
            
            <button onclick="setTab('history')" class="nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors mb-1" data-id="history">
                <i data-lucide="file-text" class="nav-icon mr-3 w-5 h-5"></i> Historial de Servicios
            </button>
            <button onclick="setTab('profile')" class="nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors mb-1" data-id="profile">
                <i data-lucide="building" class="nav-icon mr-3 w-5 h-5"></i> Perfil de Empresa
            </button>
        </div>

        <div class="p-4 border-t border-slate-200 shrink-0">
            <div class="flex items-center px-4 py-2">
                <div class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-600 mr-3">
                    <i data-lucide="user" class="w-4 h-4"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p id="sidebar-user-name" class="text-sm font-medium text-slate-900 truncate">Empresa</p>
                </div>
            </div>
            <button class="w-full mt-2 flex items-center px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                <i data-lucide="log-out" class="mr-3 w-4 h-4"></i> Cerrar Sesión
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
        
        <!-- Top Header (Mobile) -->
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 lg:hidden shrink-0">
            <div class="flex items-center">
                <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center mr-3">
                    <i data-lucide="activity" class="text-white w-5 h-5"></i>
                </div>
                <span class="text-xl font-bold text-slate-800">LabPortal</span>
            </div>
            <button onclick="toggleMobileMenu(true)" class="p-2 text-slate-500 hover:text-slate-700 focus:outline-none">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
        </header>

        <!-- Dynamic Content Area -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8" id="scroll-container">
            <div id="dynamic-content" class="max-w-6xl mx-auto pb-10">
                <!-- El contenido se inyectará aquí vía JS -->
            </div>
        </div>
    </main>
    
    <style>

    .header {
        position: fixed;

    }

    .header__container{

    }

    @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        
        /* Ocultar barra de desplazamiento global para emular mejor una app */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        :root{--site-header-height:64px}
        /* Empuja el main y el sidebar para quedar debajo de un header fijo */
        #sidebar{top:var(--site-header-height)}
        main{margin-top:var(--site-header-height)}

        /* En pantallas pequeñas el header móvil ya ocupa espacio normal, resetear offsets */
        @media (max-width: 1024px){
            :root{--site-header-height:0px}
            #sidebar{top:0}
            main{margin-top:0}
        }
    </style>

<script>
        // --- 1. Datos Mock (Simulados) ---
        const mockUser = {
            name: 'Constructora Alfa S.A.',
            contact: 'Ing. Carlos Gómez',
            email: 'cgomez@alfa.com',
            plan: 'Corporativo',
            joined: '2022-03-15'
        };

        const mockReports = [
            { id: 'INF-2023-089', date: '2023-10-25', project: 'Edificio Central', type: 'Ensayo de Concreto', status: 'Disponible' },
            { id: 'INF-2023-088', date: '2023-10-20', project: 'Puente Sur', type: 'Mecánica de Suelos', status: 'Disponible' },
            { id: 'INF-2023-085', date: '2023-10-12', project: 'Edificio Central', type: 'Prueba de Acero', status: 'Disponible' },
            { id: 'INF-2023-081', date: '2023-09-28', project: 'Vía Panamericana', type: 'Ensayo de Asfalto', status: 'Disponible' },
        ];

        const mockRequests = [
            { id: 'SOL-1045', date: '2023-10-26', type: 'Análisis Químico', status: 'En Proceso', estimatedDate: '2023-11-02' },
            { id: 'SOL-1046', date: '2023-10-27', type: 'Mecánica de Suelos', status: 'Recibido', estimatedDate: '2023-11-05' },
            { id: 'SOL-1042', date: '2023-10-20', type: 'Ensayo de Concreto', status: 'Completado', estimatedDate: '2023-10-24' },
        ];

        const mockHistory = [
            { id: 'SRV-0980', date: '2023-09-15', amount: '$1,250.00', status: 'Pagado', service: 'Paquete de Ensayos C3' },
            { id: 'SRV-0945', date: '2023-08-22', amount: '$850.00', status: 'Pagado', service: 'Suelos Fase 1' },
            { id: 'SRV-0912', date: '2023-07-10', amount: '$2,100.00', status: 'Pagado', service: 'Asesoría Integral' },
        ];

        const serviceDistribution = [
            { name: 'Mecánica de Suelos', percentage: 45, color: 'bg-indigo-600' },
            { name: 'Ensayos de Concreto', percentage: 35, color: 'bg-blue-500' },
            { name: 'Análisis Químicos', percentage: 15, color: 'bg-sky-400' },
            { name: 'Asesoría Técnica', percentage: 5, color: 'bg-slate-300' },
        ];

        // --- 2. Lógica Global y Menú ---
        let activeTab = 'dashboard';
        let searchQuery = '';

        document.getElementById('sidebar-user-name').innerText = mockUser.name;

        function toggleMobileMenu(isOpen) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            if (isOpen) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        // --- 3. Generadores de Vistas (Plantillas HTML) ---

        function renderDashboard() {
            const currentDate = new Date().toLocaleDateString('es-CO', { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
            });
            const activeServicesCount = mockRequests.filter(r => r.status !== 'Completado').length;
            const historyVolume = mockReports.length + mockHistory.length;

            const distributionHtml = serviceDistribution.map(item => `
                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="font-medium text-slate-700">${item.name}</span>
                        <span class="text-slate-500 font-semibold">${item.percentage}%</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-2">
                        <div class="${item.color} h-2 rounded-full transition-all duration-1000" style="width: ${item.percentage}%"></div>
                    </div>
                </div>
            `).join('');

            return `
                <div class="space-y-8 fade-in">
                    <div class="flex flex-col md:flex-row md:items-end justify-between border-b border-slate-200 pb-6">
                        <div>
                            <p class="text-sm font-medium text-slate-500 capitalize mb-1">${currentDate}</p>
                            <h2 class="text-3xl font-bold text-slate-900 tracking-tight">Panel Operativo</h2>
                            <p class="text-slate-600 mt-2 text-lg">
                                Resumen de actividad y métricas consolidadas para <span class="font-semibold text-slate-800">${mockUser.name}</span>.
                            </p>
                        </div>
                        <div class="mt-4 md:mt-0 px-4 py-2 bg-emerald-50 rounded-lg border border-emerald-100 flex items-center shadow-sm w-max">
                            <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-3 animate-pulse"></div>
                            <span class="text-sm font-medium text-emerald-800">Servicios Operativos</span>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <p class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Volumen Histórico</p>
                                    <p class="text-3xl font-bold text-slate-800 mt-1">${historyVolume}</p>
                                </div>
                                <div class="p-3 rounded-lg bg-slate-50 text-slate-600 border border-slate-100">
                                    <i data-lucide="file-text" class="w-6 h-6"></i>
                                </div>
                            </div>
                            <p class="text-xs text-emerald-600 font-medium flex items-center">
                                <i data-lucide="trending-up" class="w-3 h-3 mr-1"></i> +12% respecto al mes anterior
                            </p>
                        </div>
                        
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <p class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Servicios Activos</p>
                                    <p class="text-3xl font-bold text-slate-800 mt-1">${activeServicesCount}</p>
                                </div>
                                <div class="p-3 rounded-lg bg-slate-50 text-blue-600 border border-slate-100">
                                    <i data-lucide="activity" class="w-6 h-6"></i>
                                </div>
                            </div>
                            <p class="text-xs text-slate-500 font-medium">En proceso de análisis y revisión</p>
                        </div>
                        
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <p class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Tasa de Cumplimiento</p>
                                    <p class="text-3xl font-bold text-slate-800 mt-1">98.5%</p>
                                </div>
                                <div class="p-3 rounded-lg bg-slate-50 text-indigo-600 border border-slate-100">
                                    <i data-lucide="check-circle" class="w-6 h-6"></i>
                                </div>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-1.5 mt-2">
                                <div class="bg-indigo-600 h-1.5 rounded-full" style="width: 98.5%"></div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 pt-4">
                        <div class="bg-white p-7 rounded-xl border border-slate-200 shadow-sm">
                            <div class="mb-6">
                                <h3 class="text-lg font-bold text-slate-800">Distribución de Servicios</h3>
                                <p class="text-sm text-slate-500">Desglose histórico por tipo de ensayo solicitado.</p>
                            </div>
                            <div class="space-y-5">
                                ${distributionHtml}
                            </div>
                        </div>

                        <div class="bg-white p-7 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
                            <div>
                                <h3 class="text-lg font-bold text-slate-800">Métricas de Calidad (SLA)</h3>
                                <p class="text-sm text-slate-500 mb-6">Indicadores de rendimiento de nuestro laboratorio.</p>
                                <ul class="space-y-4">
                                    <li class="flex items-center justify-between pb-4 border-b border-slate-100">
                                        <div class="flex items-center text-slate-700">
                                            <div class="w-8 h-8 rounded bg-blue-50 flex items-center justify-center text-blue-600 mr-3">
                                                <i data-lucide="clock" class="w-4 h-4"></i>
                                            </div>
                                            <span class="font-medium">Tiempo prom. de entrega</span>
                                        </div>
                                        <span class="font-bold text-slate-800">48 hrs</span>
                                    </li>
                                    <li class="flex items-center justify-between pb-4 border-b border-slate-100">
                                        <div class="flex items-center text-slate-700">
                                            <div class="w-8 h-8 rounded bg-green-50 flex items-center justify-center text-green-600 mr-3">
                                                <i data-lucide="check" class="w-4 h-4"></i>
                                            </div>
                                            <span class="font-medium">Precisión de resultados</span>
                                        </div>
                                        <span class="font-bold text-slate-800">99.9%</span>
                                    </li>
                                    <li class="flex items-center justify-between">
                                        <div class="flex items-center text-slate-700">
                                            <div class="w-8 h-8 rounded bg-purple-50 flex items-center justify-center text-purple-600 mr-3">
                                                <i data-lucide="award" class="w-4 h-4"></i>
                                            </div>
                                            <span class="font-medium">Auditorías aprobadas</span>
                                        </div>
                                        <span class="font-bold text-slate-800">100%</span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderReports() {
            // Lógica de filtrado de informes
            const filteredReports = mockReports.filter(report => 
                report.id.toLowerCase().includes(searchQuery.toLowerCase()) || 
                report.project.toLowerCase().includes(searchQuery.toLowerCase())
            );

            const tableRows = filteredReports.map(report => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="p-4 font-medium text-blue-600">${report.id}</td>
                    <td class="p-4 text-slate-600">${report.date}</td>
                    <td class="p-4 text-slate-800">${report.project}</td>
                    <td class="p-4 text-slate-600">${report.type}</td>
                    <td class="p-4 text-center">
                        <button class="inline-flex items-center px-3 py-1.5 bg-blue-50 text-blue-700 rounded hover:bg-blue-100 transition-colors text-sm font-medium">
                            <i data-lucide="download" class="w-4 h-4 mr-1.5"></i> PDF
                        </button>
                    </td>
                </tr>
            `).join('');

            return `
                <div class="space-y-6 fade-in">
                    <div class="flex flex-col sm:flex-row justify-between sm:items-end gap-4">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-800">Informes de Ensayos</h2>
                            <p class="text-slate-600 mt-1">Descargue los resultados oficiales de sus solicitudes.</p>
                        </div>
                        <div class="flex space-x-2 w-full sm:w-auto">
                            <div class="relative flex-1 sm:flex-none">
                                <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 w-4 h-4"></i>
                                <input 
                                    type="text" 
                                    id="search-input"
                                    placeholder="Buscar por ID o proyecto..." 
                                    class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    value="${searchQuery}"
                                    oninput="handleSearch(this.value)"
                                />
                            </div>
                            <button class="flex items-center px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 bg-white hover:bg-slate-50">
                                <i data-lucide="filter" class="w-4 h-4 mr-2"></i> Filtrar
                            </button>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse min-w-[600px]">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-200 text-sm font-medium text-slate-500 uppercase tracking-wider">
                                        <th class="p-4">ID Informe</th>
                                        <th class="p-4">Fecha</th>
                                        <th class="p-4">Proyecto</th>
                                        <th class="p-4">Tipo de Ensayo</th>
                                        <th class="p-4 text-center">Acción</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200">
                                    ${tableRows.length > 0 ? tableRows : `<tr><td colspan="5" class="p-6 text-center text-slate-500">No se encontraron informes.</td></tr>`}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // Función auxiliar para búsqueda (solo recarga la vista)
        window.handleSearch = function(val) {
            searchQuery = val;
            const container = document.getElementById('dynamic-content');
            container.innerHTML = renderReports();
            lucide.createIcons(); // Reactivar iconos después de sobreescribir el HTML
            
            // Mantener el foco en el input al recargar
            const input = document.getElementById('search-input');
            if(input) {
                input.focus();
                input.setSelectionRange(input.value.length, input.value.length);
            }
        };

        function renderRequests() {
            const cardsHtml = mockRequests.map(req => {
                let badgeClass = '';
                let iconName = '';
                let topBarClass = '';

                if (req.status === 'Completado') {
                    badgeClass = 'bg-green-50 text-green-700 border-green-200';
                    iconName = 'check-circle';
                    topBarClass = 'bg-green-500';
                } else if (req.status === 'En Proceso') {
                    badgeClass = 'bg-amber-50 text-amber-700 border-amber-200';
                    iconName = 'clock';
                    topBarClass = 'bg-amber-500';
                } else {
                    badgeClass = 'bg-blue-50 text-blue-700 border-blue-200';
                    iconName = 'info';
                    topBarClass = 'bg-blue-500';
                }

                return `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 relative overflow-hidden">
                        <div class="h-1 w-full absolute top-0 left-0 ${topBarClass}"></div>
                        
                        <div class="flex justify-between items-start mb-4 mt-2">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${badgeClass}">
                                <i data-lucide="${iconName}" class="w-3 h-3 mr-1"></i> ${req.status}
                            </span>
                            <span class="text-sm font-medium text-slate-500">${req.id}</span>
                        </div>
                        
                        <h3 class="text-lg font-bold text-slate-800 mb-1">${req.type}</h3>
                        <p class="text-sm text-slate-500 mb-4">Ingreso: ${req.date}</p>
                        
                        <div class="pt-4 border-t border-slate-100 flex justify-between items-center">
                            <span class="text-xs text-slate-500 uppercase tracking-wider font-semibold">Entrega est.</span>
                            <span class="text-sm font-medium text-slate-800">${req.estimatedDate}</span>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="space-y-6 fade-in">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800">Estado de Solicitudes</h2>
                        <p class="text-slate-600 mt-1">Haga seguimiento en tiempo real de sus servicios en curso.</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${cardsHtml}
                    </div>
                </div>
            `;
        }

        function renderHistory() {
            const listItemsHtml = mockHistory.map(item => `
                <li class="p-4 sm:p-6 hover:bg-slate-50 transition-colors">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between">
                        <div class="mb-2 sm:mb-0">
                            <h4 class="text-lg font-semibold text-slate-800">${item.service}</h4>
                            <div class="flex items-center text-sm text-slate-500 mt-1">
                                <span class="mr-3">ID: ${item.id}</span>
                                <span>Fecha: ${item.date}</span>
                            </div>
                        </div>
                        <div class="flex items-center justify-between sm:flex-col sm:items-end">
                            <span class="text-lg font-bold text-slate-800">${item.amount}</span>
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-800 mt-1">
                                ${item.status}
                            </span>
                        </div>
                    </div>
                </li>
            `).join('');

            return `
                <div class="space-y-6 fade-in">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800">Historial de Servicios</h2>
                        <p class="text-slate-600 mt-1">Registro completo de servicios facturados y completados.</p>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <ul class="divide-y divide-slate-200">
                            ${listItemsHtml}
                        </ul>
                    </div>
                </div>
            `;
        }

        function renderProfile() {
            return `
                <div class="space-y-6 max-w-3xl fade-in">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800">Información de la Empresa</h2>
                        <p class="text-slate-600 mt-1">Gestione los datos de facturación y contacto de su cuenta.</p>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-50 px-6 py-4 border-b border-slate-200">
                            <h3 class="text-lg font-medium text-slate-800 flex items-center">
                                <i data-lucide="building" class="w-5 h-5 mr-2 text-slate-500"></i> Datos Corporativos
                            </h3>
                        </div>
                        <div class="p-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-sm font-medium text-slate-500 mb-1">Razón Social</label>
                                    <div class="text-slate-800 font-medium p-2 bg-slate-50 rounded border border-slate-100">${mockUser.name}</div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-500 mb-1">Contacto Principal</label>
                                    <div class="text-slate-800 font-medium p-2 bg-slate-50 rounded border border-slate-100">${mockUser.contact}</div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-500 mb-1">Correo Electrónico</label>
                                    <div class="text-slate-800 font-medium p-2 bg-slate-50 rounded border border-slate-100">${mockUser.email}</div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-500 mb-1">Plan de Servicio</label>
                                    <div class="text-slate-800 font-medium p-2 bg-blue-50 text-blue-800 rounded border border-blue-100">${mockUser.plan}</div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-500 mb-1">Cliente desde</label>
                                    <div class="text-slate-800 font-medium p-2 bg-slate-50 rounded border border-slate-100">${mockUser.joined}</div>
                                </div>
                            </div>
                            <div class="mt-6 flex justify-end">
                                <button class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm font-medium hover:bg-slate-700 transition-colors">
                                    Solicitar Actualización de Datos
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 4. Gestión de Estado y Renderizado ---

        function setTab(tabId) {
            activeTab = tabId;
            searchQuery = ''; // resetear busqueda al cambiar de tab

            // 1. Actualizar estilos de los botones en el sidebar
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const icon = btn.querySelector('.nav-icon');
                if (btn.getAttribute('data-id') === tabId) {
                    btn.className = 'nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors mb-1 bg-blue-50 text-blue-700';
                    if(icon) icon.className = `nav-icon mr-3 w-5 h-5 text-blue-600`;
                } else {
                    btn.className = 'nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors mb-1 text-slate-600 hover:bg-slate-50 hover:text-slate-900';
                    if(icon) icon.className = `nav-icon mr-3 w-5 h-5 text-slate-400`;
                }
            });

            // 2. Renderizar contenido correspondiente
            const container = document.getElementById('dynamic-content');
            const scrollArea = document.getElementById('scroll-container');
            
            switch(tabId) {
                case 'dashboard': container.innerHTML = renderDashboard(); break;
                case 'reports': container.innerHTML = renderReports(); break;
                case 'requests': container.innerHTML = renderRequests(); break;
                case 'history': container.innerHTML = renderHistory(); break;
                case 'profile': container.innerHTML = renderProfile(); break;
            }

            // 3. Volver el scroll arriba al cambiar de vista
            scrollArea.scrollTo(0,0);

            // 4. Reinicializar iconos de Lucide para los elementos recién creados
            lucide.createIcons();

            // 5. Cerrar menú en móvil tras selección
            toggleMobileMenu(false);
        }

        // Inicializar aplicación al cargar
        document.addEventListener('DOMContentLoaded', () => {
            setTab('dashboard'); // Cargar la vista principal por defecto
        });

    </script>

    <!-- SCRIPTS -->
    <script src="../script-v2.js"></script>
     <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons desde CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</body>
</html>
