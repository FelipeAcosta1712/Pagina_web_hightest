<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portal de Cliente HIGH TEST SAS - Acceso a sus certificados y ensayos">
    <meta name="keywords" content="portal cliente, HIGH TEST, certificados, ensayos eléctricos">
    <meta name="author" content="HIGH TEST SAS">
    <meta name="theme-color" content="#10b981">
    <link rel="icon" type="image/png" href="https://hightestsas.com/image/logo.png">
    <link rel="apple-touch-icon" href="https://hightestsas.com/image/logo.png">
    <title>Portal de Cliente | HIGH TEST SAS</title>
    <link rel="stylesheet" href="../styles-v2.css">
</head>
<body class="bg-slate-50 font-sans text-slate-900 h-screen flex overflow-hidden">

    <!-- ===================== PANTALLA DE LOGIN ===================== -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div class="login-logo">
                <a href="../index.html">
                    <img src="/image/logo.png" alt="HIGH TEST SAS" style="width:80px;height:80px;border-radius:50%;border:3px solid #003A80;">
                </a>
            </div>
            <h2 class="login-title">Portal de Cliente</h2>
            <p class="login-subtitle">Ingrese sus credenciales para acceder</p>
            <form id="loginForm" onsubmit="clientLogin(event)">
                <div class="login-field">
                    <label for="loginUser">Correo electrónico</label>
                    <input type="email" id="loginUser" placeholder="correo@empresa.com" required autocomplete="email">
                </div>
                <div class="login-field">
                    <label for="loginPass">Contraseña</label>
                    <input type="password" id="loginPass" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <div id="loginError" class="login-error" style="display:none;"></div>
                <button type="submit" class="login-btn" id="loginBtn">Ingresar</button>
            </form>
            <a href="../index.html" class="login-back">← Volver al sitio</a>
        </div>
    </div>

    <!-- ===================== CONTENIDO DEL PORTAL (oculto hasta login) ===================== -->
    <div id="portalApp" style="display:none;width:100%;height:100%;">

        <!-- HEADER CLIENTE -->
        <header class="header header--client" role="banner">
            <div class="header__container">
                <div class="header__logo">
                    <a href="../index.html#inicio" class="header__logo-link">
                        <img src="/image/logo.png" alt="HIGH TEST SAS" class="header__logo-image">
                    </a>
                </div>
                <nav class="header__nav" role="navigation" aria-label="Navegación cliente">
                    <button class="header__menu-toggle" id="clientMenuToggle" aria-label="Abrir menú" aria-expanded="false">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <ul class="header__menu" id="clientHeaderMenu">
                        <li><a href="#certificates" class="header__link">Certificados</a></li>
                        <li><a href="#history" class="header__link">Historial</a></li>
                        <li><a href="#requests" class="header__link">Solicitudes</a></li>
                        <li><a href="#support" class="header__link">Soporte</a></li>
                        <li class="header__menu-item--action">
                            <button class="header__menu-btn header__menu-btn--secondary" id="clientLogoutMobileBtn" aria-label="Cerrar sesión" onclick="clientLogout()">
                                🚪 Salir
                            </button>
                        </li>
                    </ul>
                    <button class="header__icon-btn" id="themeToggleBtn" aria-label="Cambiar tema de color" title="Cambiar tema">
                        🌙
                    </button>
                    <div class="header__user-info">
                        <span class="user-info__name" id="clientUserName">Cliente</span>
                        <span class="user-info__company" id="clientUserCompany">Empresa</span>
                    </div>
                    <button class="header__cta header__cta--logout" id="clientLogoutBtn" aria-label="Cerrar sesión" onclick="clientLogout()">
                        🚪 Salir
                    </button>
                </nav>
            </div>
        </header>

        <!-- Overlay para móvil -->
        <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleMobileMenu(false)"></div>

        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-50 w-64 bg-white border-r border-slate-200 transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-in-out flex flex-col">
            <div class="h-16 flex items-center px-6 border-b border-slate-200 shrink-0">
                <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center mr-3">
                    <i data-lucide="activity" class="text-white w-5 h-5"></i>
                </div>
                <span class="text-xl font-bold text-slate-800 tracking-tight">HIGH TEST</span>
                <button class="ml-auto lg:hidden text-slate-400 hover:text-slate-600" onclick="toggleMobileMenu(false)">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="p-4 flex-1 overflow-y-auto">
                <div class="mb-4 text-xs font-semibold text-slate-400 uppercase tracking-wider px-4">Principal</div>
                <button onclick="setTab('dashboard')" class="nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors mb-1" data-id="dashboard">
                    <i data-lucide="activity" class="nav-icon mr-3 w-5 h-5"></i> Panel Operativo
                </button>
                <button onclick="setTab('reports')" class="nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors mb-1" data-id="reports">
                    <i data-lucide="download" class="nav-icon mr-3 w-5 h-5"></i> Informes de Ensayos
                </button>
                <button onclick="setTab('requests')" class="nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors mb-1" data-id="requests">
                    <i data-lucide="clock" class="nav-icon mr-3 w-5 h-5"></i> Estado de Solicitudes
                </button>
                <div class="mt-8 mb-4 text-xs font-semibold text-slate-400 uppercase tracking-wider px-4">Administración</div>
                <button onclick="setTab('history')" class="nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors mb-1" data-id="history">
                    <i data-lucide="file-text" class="nav-icon mr-3 w-5 h-5"></i> Historial de Servicios
                </button>
                <button onclick="setTab('profile')" class="nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors mb-1" data-id="profile">
                    <i data-lucide="building" class="nav-icon mr-3 w-5 h-5"></i> Perfil de Empresa
                </button>
            </div>

            <div class="p-4 border-t border-slate-200 shrink-0">
                <div class="flex items-center px-4 py-2">
                    <div class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-600 mr-3">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p id="sidebar-user-name" class="text-sm font-medium text-slate-900 truncate">Empresa</p>
                    </div>
                </div>
                <button class="w-full mt-2 flex items-center px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-lg transition-colors" onclick="clientLogout()">
                    <i data-lucide="log-out" class="mr-3 w-4 h-4"></i> Cerrar Sesión
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <!-- Top Header (Mobile) -->
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 lg:hidden shrink-0">
                <div class="flex items-center">
                    <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center mr-3">
                        <i data-lucide="activity" class="text-white w-5 h-5"></i>
                    </div>
                    <span class="text-xl font-bold text-slate-800">HIGH TEST</span>
                </div>
                <button onclick="toggleMobileMenu(true)" class="p-2 text-slate-500 hover:text-slate-700 focus:outline-none">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
            </header>

            <!-- Dynamic Content Area -->
            <div class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8" id="scroll-container">
                <div id="dynamic-content" class="max-w-6xl mx-auto pb-10"></div>
            </div>
        </main>
    </div>

    <style>
        /* ===== LOGIN ===== */
        .login-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
            z-index: 9999;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .login-logo {
            margin-bottom: 20px;
        }

        .login-title {
            font-size: 22px;
            font-weight: 800;
            color: #1e293b;
            margin: 0 0 4px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #64748b;
            margin: 0 0 28px;
        }

        .login-field {
            text-align: left;
            margin-bottom: 18px;
        }

        .login-field label {
            display: block;
            font-size: 13px;

            color: #475569;
            margin-bottom: 6px;
        }

        .login-field input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;

            box-sizing: border-box;
        }

        .login-field input:focus {
            border-color: #003A80;
            box-shadow: 0 0 0 3px rgba(0, 58, 128, 0.15);
        }

        .login-error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
            text-align: left;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #003A80;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background: #001f4d;
        }

        .login-btn:disabled {

            cursor: not-allowed;
        }

        .login-back {

        }

        .login-back:hover {

        }

        /* ===== PORTAL ===== */
        .header {
            position: fixed;
            width: 100%;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .header__container {
            max-width: 100%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        :root{--site-header-height:64px}
        #sidebar{top:var(--site-header-height)}
        main{margin-top:var(--site-header-height)}

        @media (max-width: 1024px){
            :root{--site-header-height:0px}
            #sidebar{top:0}
            main{margin-top:0}
        }

        /* ===== ESTADO DE SOLICITUDES ===== */
        .req-card { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 12px; }
        .req-left { flex: 0 0 200px; min-width: 200px; }
        .req-center { flex: 1; min-width: 300px; }
        .req-right { flex: 0 0 200px; min-width: 200px; text-align: right; }
        .timeline-container { display: flex; align-items: flex-start; position: relative; padding: 0 10px; }
        .timeline-step { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
        .timeline-connector { position: absolute; top: 11px; left: 50%; right: -50%; height: 2px; z-index: 0; }
        .timeline-circle { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 2; }

            .req-card { flex-direction: column; align-items: flex-start; }
            .req-right { text-align: left; flex: 1; min-width: 100%; }
        }
        @media (max-width: 640px) {
            .req-left, .req-center, .req-right { flex: 1; min-width: 100%; }
        }
    </style>

<script>
        // --- 1. Usuarios registrados (simulados en localStorage) ---
        function getRegisteredUsers() {
            const users = localStorage.getItem('registeredClients');
            if (users) return JSON.parse(users);
            // Usuario por defecto para pruebas
            const defaultUsers = [
                { email: 'cliente@test.com', password: '123456', name: 'Constructora Alfa S.A.', contact: 'Ing. Carlos Gómez', plan: 'Corporativo', joined: '2022-03-15' }
            ];
            localStorage.setItem('registeredClients', JSON.stringify(defaultUsers));
            return defaultUsers;
        }

        // --- 2. Login ---
        function clientLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginUser').value.trim().toLowerCase();
            const pass = document.getElementById('loginPass').value;
            const errorEl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            errorEl.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Ingresando...';

            setTimeout(() => {
                const users = getRegisteredUsers();
                const user = users.find(u => u.email === email && u.password === pass);

                if (user) {
                    // Guardar sesión activa
                    const session = {
                        email: user.email,
                        name: user.name,
                        contact: user.contact,
                        plan: user.plan || '',
                        joined: user.joined || '',
                        loginAt: new Date().toISOString()
                    };
                    localStorage.setItem('clientSession', JSON.stringify(session));

                    // Cargar datos del portal
                    loadClientData(session);
                    showPortal();
                } else {
                    errorEl.textContent = 'Correo o contraseña incorrectos. Intente de nuevo.';
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Ingresar';
                    document.getElementById('loginPass').value = '';
                    document.getElementById('loginPass').focus();
                }
            }, 500);
        }

        // --- 3. Logout ---
        function clientLogout() {
            localStorage.removeItem('clientSession');
            localStorage.removeItem('clientData');
            showLogin();
        }

        // --- 4. Mostrar/ocultar login vs portal ---
        function showLogin() {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('portalApp').style.display = 'none';
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('loginBtn').textContent = 'Ingresar';
        }

        function showPortal() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('portalApp').style.display = 'block';
            setTab('dashboard');
            lucide.createIcons();
        }

        // --- 5. Datos del portal ---
        const clientData = {
            user: { name: '', contact: '', email: '', plan: '', joined: '' },
            reports: [],
            requests: [],
            history: [],
            serviceDistribution: []
        };

        function loadClientData(session) {
            clientData.user.name = session.name || '';
            clientData.user.contact = session.contact || '';
            clientData.user.email = session.email || '';
            clientData.user.plan = session.plan || '';
            clientData.user.joined = session.joined || '';

            const saved = localStorage.getItem('clientData');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    clientData.reports = parsed.reports || [];
                    clientData.requests = parsed.requests || [];
                    clientData.history = parsed.history || [];
                    clientData.serviceDistribution = parsed.serviceDistribution || [];
                } catch(e) {}
            }
            updateUserDisplay();
        }

        function updateUserDisplay() {
            const nameEl = document.getElementById('clientUserName');
            const companyEl = document.getElementById('clientUserCompany');
            const sidebarName = document.getElementById('sidebar-user-name');
            if (nameEl) nameEl.textContent = clientData.user.contact || 'Cliente';
            if (companyEl) companyEl.textContent = clientData.user.name || 'Empresa';
            if (sidebarName) sidebarName.textContent = clientData.user.name || 'Empresa';
        }

        // --- 6. Menú móvil ---
        function toggleMobileMenu(isOpen) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            if (isOpen) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        // --- 7. Renderizado de vistas ---
        let activeTab = 'dashboard';
        let searchQuery = '';
        let filterStatus = 'all';

        function renderDashboard() {
            const currentDate = new Date().toLocaleDateString('es-CO', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const activeCount = clientData.requests.filter(r => r.status !== 'Completado').length;
            const totalVolume = clientData.reports.length + clientData.history.length;
            const pct = clientData.requests.length > 0 ? Math.round((clientData.requests.filter(r => r.status === 'Completado').length / clientData.requests.length) * 100) : 0;

            const distHtml = clientData.serviceDistribution.length > 0
                ? clientData.serviceDistribution.map(i => `<div><div class="flex justify-between text-sm mb-1"><span class="font-medium text-slate-700">${i.name}</span><span class="text-slate-500 font-semibold">${i.percentage}%</span></div><div class="w-full bg-slate-100 rounded-full h-2"><div class="${i.color} h-2 rounded-full transition-all duration-1000" style="width:${i.percentage}%"></div></div></div>`).join('')
                : '<p class="text-slate-400 text-sm">Sin datos de distribución disponibles.</p>';

            return `<div class="space-y-8 fade-in">
                <div class="flex flex-col md:flex-row md:items-end justify-between border-b border-slate-200 pb-6">
                    <div><p class="text-sm font-medium text-slate-500 capitalize mb-1">${currentDate}</p><h2 class="text-3xl font-bold text-slate-900 tracking-tight">Panel Operativo</h2><p class="text-slate-600 mt-2 text-lg">Resumen de actividad para <span class="font-semibold text-slate-800">${clientData.user.name || 'su empresa'}</span>.</p></div>
                    <div class="mt-4 md:mt-0 px-4 py-2 bg-emerald-50 rounded-lg border border-emerald-100 flex items-center shadow-sm w-max"><div class="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-3 animate-pulse"></div><span class="text-sm font-medium text-emerald-800">Servicios Operativos</span></div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6"><div class="flex justify-between items-start mb-4"><div><p class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Volumen Histórico</p><p class="text-3xl font-bold text-slate-800 mt-1">${totalVolume}</p></div><div class="p-3 rounded-lg bg-slate-50 text-slate-600 border border-slate-100"><i data-lucide="file-text" class="w-6 h-6"></i></div></div><p class="text-xs text-emerald-600 font-medium flex items-center"><i data-lucide="trending-up" class="w-3 h-3 mr-1"></i> Informes y servicios registrados</p></div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6"><div class="flex justify-between items-start mb-4"><div><p class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Servicios Activos</p><p class="text-3xl font-bold text-slate-800 mt-1">${activeCount}</p></div><div class="p-3 rounded-lg bg-slate-50 text-blue-600 border border-slate-100"><i data-lucide="activity" class="w-6 h-6"></i></div></div><p class="text-xs text-slate-500 font-medium">En proceso de análisis</p></div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6"><div class="flex justify-between items-start mb-4"><div><p class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Tasa de Cumplimiento</p><p class="text-3xl font-bold text-slate-800 mt-1">${pct}%</p></div><div class="p-3 rounded-lg bg-slate-50 text-indigo-600 border border-slate-100"><i data-lucide="check-circle" class="w-6 h-6"></i></div></div><div class="w-full bg-slate-100 rounded-full h-1.5 mt-2"><div class="bg-indigo-600 h-1.5 rounded-full" style="width:${pct}%"></div></div></div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 pt-4">
                    <div class="bg-white p-7 rounded-xl border border-slate-200 shadow-sm"><div class="mb-6"><h3 class="text-lg font-bold text-slate-800">Distribución de Servicios</h3><p class="text-sm text-slate-500">Desglose histórico por tipo de ensayo.</p></div><div class="space-y-5">${distHtml}</div></div>
                    <div class="bg-white p-7 rounded-xl border border-slate-200 shadow-sm"><div><h3 class="text-lg font-bold text-slate-800">Métricas de Calidad (SLA)</h3><p class="text-sm text-slate-500 mb-6">Indicadores de rendimiento.</p><ul class="space-y-4"><li class="flex items-center justify-between pb-4 border-b border-slate-100"><div class="flex items-center text-slate-700"><div class="w-8 h-8 rounded bg-blue-50 flex items-center justify-center text-blue-600 mr-3"><i data-lucide="clock" class="w-4 h-4"></i></div><span class="font-medium">Tiempo prom. de entrega</span></div><span class="font-bold text-slate-800">48 hrs</span></li><li class="flex items-center justify-between pb-4 border-b border-slate-100"><div class="flex items-center text-slate-700"><div class="w-8 h-8 rounded bg-green-50 flex items-center justify-center text-green-600 mr-3"><i data-lucide="check" class="w-4 h-4"></i></div><span class="font-medium">Precisión de resultados</span></div><span class="font-bold text-slate-800">99.9%</span></li><li class="flex items-center justify-between"><div class="flex items-center text-slate-700"><div class="w-8 h-8 rounded bg-purple-50 flex items-center justify-center text-purple-600 mr-3"><i data-lucide="award" class="w-4 h-4"></i></div><span class="font-medium">Auditorías aprobadas</span></div><span class="font-bold text-slate-800">100%</span></li></ul></div></div>
                </div>
            </div>`;
        }

        function renderReports() {
            const filtered = clientData.reports.filter(r => r.id.toLowerCase().includes(searchQuery.toLowerCase()) || r.project.toLowerCase().includes(searchQuery.toLowerCase()));
            const rows = filtered.map(r => `<tr class="hover:bg-slate-50 transition-colors"><td class="p-4 font-medium text-blue-600">${r.id}</td><td class="p-4 text-slate-600">${r.date}</td><td class="p-4 text-slate-800">${r.project}</td><td class="p-4 text-slate-600">${r.type}</td><td class="p-4 text-center"><button class="inline-flex items-center px-3 py-1.5 bg-blue-50 text-blue-700 rounded hover:bg-blue-100 transition-colors text-sm font-medium"><i data-lucide="download" class="w-4 h-4 mr-1.5"></i> PDF</button></td></tr>`).join('');
            return `<div class="space-y-6 fade-in"><div class="flex flex-col sm:flex-row justify-between sm:items-end gap-4"><div><h2 class="text-2xl font-bold text-slate-800">Informes de Ensayos</h2><p class="text-slate-600 mt-1">Descargue los resultados oficiales de sus solicitudes.</p></div><div class="flex space-x-2 w-full sm:w-auto"><div class="relative flex-1 sm:flex-none"><i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 w-4 h-4"></i><input type="text" id="search-input" placeholder="Buscar por ID o proyecto..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" value="${searchQuery}" oninput="handleSearch(this.value)"/></div><button class="flex items-center px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 bg-white hover:bg-slate-50"><i data-lucide="filter" class="w-4 h-4 mr-2"></i> Filtrar</button></div></div><div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-left border-collapse min-w-[600px]"><thead><tr class="bg-slate-50 border-b border-slate-200 text-sm font-medium text-slate-500 uppercase tracking-wider"><th class="p-4">ID Informe</th><th class="p-4">Fecha</th><th class="p-4">Proyecto</th><th class="p-4">Tipo de Ensayo</th><th class="p-4 text-center">Acción</th></tr></thead><tbody class="divide-y divide-slate-200">${rows.length > 0 ? rows : '<tr><td colspan="5" class="p-6 text-center text-slate-500">No se encontraron informes.</td></tr>'}</tbody></table></div></div></div>`;
        }

        window.handleSearch = function(val) { searchQuery = val; const c = document.getElementById('dynamic-content'); c.innerHTML = renderReports(); const i = document.getElementById('search-input'); if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);} };

        function getTimelineStepIndex(statusRaw) {
            const raw = String(statusRaw || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[_\s-]+/g, '');
            if (raw.includes('finalizado') || raw.includes('completado')) return 5;
            if (raw.includes('informe')) return 4;
            if (raw.includes('entregacliente') || raw.includes('entrega')) return 3;
            if (raw.includes('procesodeensayo') || raw.includes('ensayo') || raw.includes('proceso')) return 2;
            if (raw.includes('lavado')) return 1;
            if (raw.includes('recepcion')) return 0;
            return 0;
        }

        function renderRequests() {
            const allItems = [...clientData.requests, ...clientData.history];
            let filtered = allItems;
            if (filterStatus !== 'all') {
                if (filterStatus === 'En Proceso') {
                    filtered = allItems.filter(r => {
                        const raw = String(r.statusRaw || r.status || '').toLowerCase();
                        return !raw.includes('finalizado') && !raw.includes('completado') && !raw.includes('entrega') && !raw.includes('informe');
                    });
                } else if (filterStatus === 'Listas para Entrega') {
                    filtered = allItems.filter(r => {
                        const raw = String(r.statusRaw || r.status || '').toLowerCase();
                        const inf = (r.informe || '').trim();
                        const hasInforme = inf && inf !== '-' && inf !== '—';
                        return hasInforme && !raw.includes('finalizado') && !raw.includes('completado');
                    });
                } else if (filterStatus === 'Finalizadas') {
                    filtered = allItems.filter(r => {
                        const raw = String(r.statusRaw || r.status || '').toLowerCase();
                        return raw.includes('finalizado') || raw.includes('completado');
                    });
                }
            }

            const totalCount = allItems.length;
            const finalizadasCount = allItems.filter(r => {
                const raw = String(r.statusRaw || r.status || '').toLowerCase();
                return raw.includes('finalizado') || raw.includes('completado');
            }).length;
            const enProcesoCount = totalCount - finalizadasCount;
            const informesCount = allItems.filter(r => {
                const raw = String(r.statusRaw || r.status || '').toLowerCase();
                const inf = (r.informe || '').trim();
                const hasInforme = inf && inf !== '-' && inf !== '—';
                return hasInforme && !raw.includes('finalizado') && !raw.includes('completado');
            }).length;

            const summaryCards = `
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px;">
                    <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;display:flex;align-items:center;gap:14px;">
                        <div style="width:48px;height:48px;background:#eff6ff;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                            <i data-lucide="file-text" class="w-6 h-6 text-blue-600"></i>
                        </div>
                        <div>
                            <div style="font-size:13px;color:#64748b;font-weight:600;">Solicitudes Totales</div>
                            <div style="font-size:28px;font-weight:800;color:#1e293b;">${totalCount}</div>
                            <div style="font-size:11px;color:#2563eb;font-weight:600;">Todas las solicitudes registradas</div>
                        </div>
                    </div>
                    <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;display:flex;align-items:center;gap:14px;">
                        <div style="width:48px;height:48px;background:#fff7ed;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                            <i data-lucide="clock" class="w-6 h-6 text-amber-600"></i>
                        </div>
                        <div>
                            <div style="font-size:13px;color:#64748b;font-weight:600;">En Proceso</div>
                            <div style="font-size:28px;font-weight:800;color:#1e293b;">${enProcesoCount}</div>
                            <div style="font-size:11px;color:#d97706;font-weight:600;">Actualmente en ejecución</div>
                        </div>
                    </div>
                    <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;display:flex;align-items:center;gap:14px;">
                        <div style="width:48px;height:48px;background:#f0fdf4;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                            <i data-lucide="check-circle" class="w-6 h-6 text-green-600"></i>
                        </div>
                        <div>
                            <div style="font-size:13px;color:#64748b;font-weight:600;">Informes Disponibles</div>
                            <div style="font-size:28px;font-weight:800;color:#1e293b;">${informesCount}</div>
                            <div style="font-size:11px;color:#16a34a;font-weight:600;">Listos para entrega</div>
                        </div>
                    </div>
                    <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;display:flex;align-items:center;gap:14px;">
                        <div style="width:48px;height:48px;background:#faf5ff;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                            <i data-lucide="flag" class="w-6 h-6 text-purple-600"></i>
                        </div>
                        <div>
                            <div style="font-size:13px;color:#64748b;font-weight:600;">Finalizadas</div>
                            <div style="font-size:28px;font-weight:800;color:#1e293b;">${finalizadasCount}</div>
                            <div style="font-size:11px;color:#9333ea;font-weight:600;">Procesos completados</div>
                        </div>
                    </div>
                </div>
            `;

            const tabs = [
                { id: 'all', label: 'Todas' },
                { id: 'En Proceso', label: 'En Proceso' },
                { id: 'Listas para Entrega', label: 'Listas para Entrega' },
                { id: 'Finalizadas', label: 'Finalizadas' }
            ];
            const tabsHtml = tabs.map(t => {
                const isActive = filterStatus === t.id || (filterStatus === 'all' && t.id === 'all');
                const activeStyle = isActive ? 'background:#2563eb;color:#fff;border-color:#2563eb;' : 'background:#fff;color:#475569;border-color:#e2e8f0;';
                return `<button onclick="filterRequests('${t.id}')" style="padding:8px 16px;border-radius:8px;border:1px solid #e2e8f0;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;${activeStyle}" onmouseover="${isActive ? '' : 'this.style.background=\'#f8fafc\';'}" onmouseout="${isActive ? '' : 'this.style.background=\'#fff\';'}">${t.label}</button>`;
            }).join('');

            const stepDefs = [
                { key: 'recepcion', label: 'Recepción', color: '#3b82f6', bg: '#eff6ff' },
                { key: 'lavado',    label: 'Lavado',    color: '#06b6d4', bg: '#ecfeff' },
                { key: 'proceso',   label: 'Proceso de ensayo', color: '#f97316', bg: '#fff7ed' },
                { key: 'entrega',   label: 'Entrega cliente',   color: '#a855f7', bg: '#faf5ff' },
                { key: 'informe',   label: 'Informe',   color: '#22c55e', bg: '#f0fdf4' },
                { key: 'finalizado',label: 'Finalizado',color: '#15803d', bg: '#dcfce7' }
            ];

            const cards = filtered.map(req => {
                const raw = String(req.statusRaw || req.status || '').toLowerCase();
                const isFinalizado = raw.includes('finalizado') || raw.includes('completado');
                const isInforme = raw.includes('informe');
                const isEntrega = raw.includes('entrega');
                const isProceso = raw.includes('proceso') || raw.includes('ensayo');
                const isLavado = raw.includes('lavado');
                const isRecepcion = raw.includes('recepcion');

                const currentStepIndex = getTimelineStepIndex(req.statusRaw || req.status);

                const timelineHtml = stepDefs.map((step, idx) => {
                    const isLast = idx === stepDefs.length - 1;
                    const isDone = idx < currentStepIndex;
                    const isCurrent = idx === currentStepIndex;
                    const connectorColor = isDone ? step.color : '#e2e8f0';
                    const connector = !isLast ? `<div class="timeline-connector" style="background:${connectorColor};"></div>` : '';

                    let circleHtml = '', labelStyle = '';
                    if (isDone) {
                        circleHtml = `<div class="timeline-circle" style="background:${step.color};"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>`;
                        labelStyle = `color:${step.color};font-weight:600;`;
                    } else if (isCurrent) {
                        circleHtml = `<div class="timeline-circle" style="background:${step.bg};border:2px solid ${step.color};"><div style="width:8px;height:8px;background:${step.color};border-radius:50%;"></div></div>`;
                        labelStyle = `color:${step.color};font-weight:700;`;
                    } else {
                        circleHtml = `<div class="timeline-circle" style="background:#fff;border:2px solid #e2e8f0;"></div>`;
                        labelStyle = 'color:#94a3b8;font-weight:500;';
                    }

                    return `<div class="timeline-step">
                        ${circleHtml}
                        <span style="font-size:11px;${labelStyle}">${step.label}</span>
                        ${connector}
                    </div>`;
                }).join('');

                let badgeStyle = '', badgeText = '';
                if (isFinalizado) { badgeStyle = 'background:#d1fae5;color:#059669;border:1px solid #a7f3d0;'; badgeText = 'Finalizada'; }
                else if (isEntrega || isInforme) { badgeStyle = 'background:#d1fae5;color:#059669;border:1px solid #a7f3d0;'; badgeText = 'Entrega cliente'; }
                else { badgeStyle = 'background:#fef3c7;color:#b45309;border:1px solid #fde68a;'; badgeText = 'En proceso'; }

                let rightStatus = '', rightSub = '', rightColor = '';
                if (isFinalizado) { rightStatus = 'FINALIZADA'; rightSub = 'Proceso completado'; rightColor = '#15803d'; }
                else if (isInforme) { rightStatus = 'INFORME DISPONIBLE'; rightSub = 'Listo para entrega'; rightColor = '#22c55e'; }
                else if (isEntrega) { rightStatus = 'ENTREGA CLIENTE'; rightSub = 'Listo para entrega'; rightColor = '#a855f7'; }
                else if (isProceso) { rightStatus = 'EN PROCESO'; rightSub = 'Ensayo en ejecución'; rightColor = '#f97316'; }
                else if (isLavado) { rightStatus = 'EN PROCESO'; rightSub = 'En espera de lavado'; rightColor = '#06b6d4'; }
                else if (isRecepcion) { rightStatus = 'EN PROCESO'; rightSub = 'En espera de recepción'; rightColor = '#3b82f6'; }
                else { rightStatus = 'EN PROCESO'; rightSub = 'En espera'; rightColor = '#64748b'; }

                return `<div class="req-card">
                    <div class="req-left">
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                            <span style="font-size:16px;font-weight:800;color:#1e293b;font-family:monospace;">${req.id}</span>
                            <span style="display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;${badgeStyle}">${badgeText}</span>
                        </div>
                        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:12px;color:#64748b;">
                            <i data-lucide="user" class="w-3.5 h-3.5 text-slate-400"></i>
                            <span>Cliente: ${req.client || clientData.user.name || 'ONAC'}</span>
                        </div>
                        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:12px;color:#64748b;">
                            <i data-lucide="file-text" class="w-3.5 h-3.5 text-slate-400"></i>
                            <span>Informe a nombre de: ${req.informe_a_nombre_de || req.client || clientData.user.name || '—'}</span>
                        </div>
                        <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#64748b;">
                            <i data-lucide="calendar" class="w-3.5 h-3.5 text-slate-400"></i>
                            <span>Fecha: ${req.date}</span>
                        </div>
                    </div>
                    <div class="req-center">
                        <div style="font-size:12px;font-weight:700;color:#64748b;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px;">Estado del Proceso</div>
                        <div class="timeline-container">${timelineHtml}</div>
                    </div>
                    <div class="req-right">
                        <div style="display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-bottom:4px;">
                            <div style="width:8px;height:8px;background:${rightColor};border-radius:50%;"></div>
                            <span style="font-size:12px;font-weight:800;color:${rightColor};">${rightStatus}</span>
                        </div>
                        <div style="font-size:12px;color:#64748b;margin-bottom:12px;">${rightSub}</div>
                        <button onclick="openRequestDetail('${req.id}')" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;" onmouseover="this.style.background='#dbeafe';" onmouseout="this.style.background='#eff6ff';">Ver detalle <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></button>
                    </div>
                </div>`;
            }).join('');

            const emptyState = `<div style="text-align:center;padding:48px 16px;color:#94a3b8;">
                <div style="width:64px;height:64px;background:#f1f5f9;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
                    <i data-lucide="clipboard-list" class="w-8 h-8 text-slate-300"></i>
                </div>
                <h3 style="font-size:16px;font-weight:600;color:#475569;margin-bottom:8px;">No hay solicitudes activas</h3>
                <p style="font-size:13px;color:#94a3b8;max-width:360px;margin:0 auto;">Los ensayos en curso aparecerán aquí para su seguimiento.</p>
            </div>`;

            return `<div class="space-y-6 fade-in">
                <div style="margin-bottom:24px;">
                    <h2 style="font-size:24px;font-weight:800;color:#1e293b;margin:0 0 4px;">Estado de Solicitudes</h2>
                    <p style="font-size:14px;color:#64748b;margin:0;">Consulta el estado actual de tus ensayos y solicitudes.</p>
                </div>
                ${summaryCards}
                <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
                    ${tabsHtml}
                </div>
                ${filtered.length > 0 ? cards : emptyState}
                <div style="display:flex;align-items:center;gap:8px;margin-top:24px;padding:16px;background:#eff6ff;border:1px solid #dbeafe;border-radius:8px;">
                    <div style="width:20px;height:20px;background:#2563eb;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    </div>
                    <p style="font-size:13px;color:#1e40af;margin:0;flex:1;">Los estados se actualizan automáticamente. Si tienes dudas sobre tu solicitud, contáctanos.</p>
                    <a href="mailto:contacto@hightestsas.com" style="padding:8px 16px;background:#fff;color:#2563eb;border:1px solid #bfdbfe;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;">
                        <i data-lucide="message-circle" class="w-3.5 h-3.5"></i>
                        Contáctanos
                    </a>
                </div>
            </div>`;
        }

        window.filterRequests = function(status) {
            filterStatus = status;
            const c = document.getElementById('dynamic-content');
            c.innerHTML = renderRequests();
            lucide.createIcons();
        };

        window.openRequestDetail = function(id) {
            alert('Detalle del proceso ' + id);
        };

        function renderHistory() {
            const items = clientData.history.map(i => `<li class="p-4 sm:p-6 hover:bg-slate-50 transition-colors"><div class="flex flex-col sm:flex-row sm:items-center justify-between"><div class="mb-2 sm:mb-0"><h4 class="text-lg font-semibold text-slate-800">${i.service}</h4><div class="flex items-center text-sm text-slate-500 mt-1"><span class="mr-3">ID: ${i.id}</span><span>Fecha: ${i.date}</span></div></div><div class="flex items-center justify-between sm:flex-col sm:items-end"><span class="text-lg font-bold text-slate-800">${i.amount}</span><span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-800 mt-1">${i.status}</span></div></div></li>`).join('');
            return `<div class="space-y-6 fade-in"><div><h2 class="text-2xl font-bold text-slate-800">Historial de Servicios</h2><p class="text-slate-600 mt-1">Registro completo de servicios facturados.</p></div><div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden"><ul class="divide-y divide-slate-200">${items.length > 0 ? items : '<li class="p-6 text-center text-slate-400">No hay historial registrado.</li>'}</ul></div></div>`;
        }

        function renderProfile() {
            const u = clientData.user;
            return `<div class="space-y-6 max-w-3xl fade-in"><div><h2 class="text-2xl font-bold text-slate-800">Información de la Empresa</h2><p class="text-slate-600 mt-1">Datos de facturación y contacto.</p></div><div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden"><div class="bg-slate-50 px-6 py-4 border-b border-slate-200"><h3 class="text-lg font-medium text-slate-800 flex items-center"><i data-lucide="building" class="w-5 h-5 mr-2 text-slate-500"></i> Datos Corporativos</h3></div><div class="p-6"><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div><label class="block text-sm font-medium text-slate-500 mb-1">Razón Social</label><div class="text-slate-800 font-medium p-2 bg-slate-50 rounded border border-slate-100">${u.name || '—'}</div></div><div><label class="block text-sm font-medium text-slate-500 mb-1">Contacto Principal</label><div class="text-slate-800 font-medium p-2 bg-slate-50 rounded border border-slate-100">${u.contact || '—'}</div></div><div><label class="block text-sm font-medium text-slate-500 mb-1">Correo Electrónico</label><div class="text-slate-800 font-medium p-2 bg-slate-50 rounded border border-slate-100">${u.email || '—'}</div></div><div><label class="block text-sm font-medium text-slate-500 mb-1">Plan de Servicio</label><div class="text-slate-800 font-medium p-2 bg-blue-50 text-blue-800 rounded border border-blue-100">${u.plan || '—'}</div></div></div><div class="mt-6 flex justify-end"><button class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm font-medium hover:bg-slate-700 transition-colors">Solicitar Actualización de Datos</button></div></div></div></div>`;
        }

        // --- 8. Navegación ---
        function setTab(tabId) {
            activeTab = tabId;
            searchQuery = '';
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const icon = btn.querySelector('.nav-icon');
                if (btn.getAttribute('data-id') === tabId) {
                    btn.className = 'nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors mb-1 bg-blue-50 text-blue-700';
                    if(icon) icon.className = 'nav-icon mr-3 w-5 h-5 text-blue-600';
                } else {
                    btn.className = 'nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors mb-1 text-slate-600 hover:bg-slate-50 hover:text-slate-900';
                    if(icon) icon.className = 'nav-icon mr-3 w-5 h-5 text-slate-400';
                }
            });
            const container = document.getElementById('dynamic-content');
            const scrollArea = document.getElementById('scroll-container');
            switch(tabId) {
                case 'dashboard': container.innerHTML = renderDashboard(); break;
                case 'reports': container.innerHTML = renderReports(); break;
                case 'requests': container.innerHTML = renderRequests(); break;
                case 'history': container.innerHTML = renderHistory(); break;
                case 'profile': container.innerHTML = renderProfile(); break;
            }
            scrollArea.scrollTo(0,0);
            lucide.createIcons();
            toggleMobileMenu(false);
        }

        // --- 9. API pública ---
        window.ClientPortal = {
            setData: function(data) {
                Object.assign(clientData, data);
                localStorage.setItem('clientData', JSON.stringify(clientData));
                updateUserDisplay();
                setTab(activeTab);
            },
            registerUser: function(userData) {
                const users = getRegisteredUsers();
                if (users.find(u => u.email === userData.email)) {
                    return { success: false, message: 'El correo ya está registrado.' };
                }
                users.push(userData);
                localStorage.setItem('registeredClients', JSON.stringify(users));
                return { success: true };
            },
            getUser: function() { return clientData.user; },
            getReports: function() { return clientData.reports; },
            getRequests: function() { return clientData.requests; },
            getHistory: function() { return clientData.history; }
        };

        // --- 10. Inicializar ---
        document.addEventListener('DOMContentLoaded', () => {
            const session = localStorage.getItem('clientSession');
            if (session) {
                try {
                    const s = JSON.parse(session);
                    loadClientData(s);
                    showPortal();
                } catch(e) {
                    showLogin();
                }
            } else {
                showLogin();
            }
        });
    </script>

    <script src="../script-v2.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</body>
</html>
