<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Informes de Laboratorio</title>
    
    <!-- Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y ReactDOM para la lógica de la interfaz -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para compilar el JavaScript en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Estilos personalizados para la barra de desplazamiento y modo impresión */
        body { font-family: system-ui, -apple-system, sans-serif; }
        .styled-scrollbar::-webkit-scrollbar { height: 6px; }
        .styled-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .styled-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        @media print {
            body { background-color: white !important; margin: 0 !important; padding: 0 !important; }
            .print\:hidden { display: none !important; }
            .print\:shadow-none { box-shadow: none !important; }
            .print\:border-none { border: none !important; }
            .print\:p-0 { padding: 0 !important; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    
    <!-- Contenedor principal de la aplicación -->
    <div id="root"></div>

    <!-- Lógica de la aplicación en JavaScript -->
    <script type="text/babel" data-presets="react,env">
        
        const { useState } = React;

        // --- COMPONENTE REUTILIZABLE PARA ENCABEZADOS Y CONDICIONES AMBIENTALES ---
        const TopSection = ({ reportCode, tituloEnsayo, normativa, numNormativa, reglas = [], env = {}, setEnv, notasExtra }) => (
          <div className="space-y-4 max-w-[100%] overflow-x-auto text-black pb-4">
            <div className="relative text-center mb-6">
              <div className="absolute top-0 left-0 text-xs text-left print:hidden">
                <div>APROBADO: <input type="text" className="w-24 border-b border-gray-400 focus:outline-none bg-transparent" placeholder="ESPECIFICAR" /></div>
                <div>REALIZÓ: <input type="text" className="w-24 border-b border-gray-400 focus:outline-none bg-transparent" placeholder="ESPECIFICAR" /></div>
              </div>
              <div className="absolute top-0 right-0 text-xs text-right font-bold">FR 7.8-V04</div>
              <h2 className="text-4xl font-bold tracking-tight">RESULTADO DE ENSAYO</h2>
              <p className="text-xl mt-1 font-semibold">No. {reportCode}</p>
            </div>

            <div className="flex border-2 border-black bg-white">
              <div className="w-1/2 border-r-2 border-black">
                <div className="flex border-b border-black">
                  <div className="w-1/3 bg-[#b4c6e7] font-bold text-center py-2 text-sm flex items-center justify-center border-r border-black">ENSAYO</div>
                  <div className="w-2/3 text-center py-2 text-sm font-bold flex items-center justify-center px-2">{tituloEnsayo}</div>
                </div>
                <div className="flex">
                  <div className="w-1/3 bg-[#b4c6e7] font-bold text-center py-2 text-sm flex items-center justify-center border-r border-black">REFERENCIA NORMATIVA</div>
                  <div className="w-2/3 text-center py-2 text-sm font-bold flex flex-col items-center justify-center px-2"><span>{normativa}</span><span>{numNormativa}</span></div>
                </div>
              </div>
              <div className="w-1/2 p-2 text-[10px] sm:text-xs text-left flex flex-col justify-center bg-white space-y-1">
                {reglas.map((regla, idx) => <p key={idx}>{regla}</p>)}
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
              <div className="border border-black flex flex-col h-full bg-white">
                <div className="bg-[#002060] text-white text-center py-2 font-bold text-xs uppercase h-12 flex flex-col justify-center"><span>FECHA DE EJECUCIÓN</span><span>AAAA-MM-DD</span></div>
                <div className="flex-1 flex items-center justify-center font-bold"><input type="text" className="w-full text-center focus:outline-none bg-transparent" value={env?.fechaEjecucion || ''} onChange={e => setEnv && setEnv({...env, fechaEjecucion: e.target.value})} /></div>
              </div>
              <div className="border border-black flex flex-col bg-white">
                <div className="bg-[#002060] text-white text-center py-1 font-bold text-xs uppercase">CONDICIONES AMBIENTALES</div>
                <div className="flex flex-1">
                  <div className="w-1/2 border-r border-dashed border-gray-400">
                    <div className="bg-[#002060] text-white text-center text-xs pb-1 font-bold">Temperatura (°C)</div>
                    <div className="flex border-t border-black bg-[#002060] text-white text-xs"><div className="w-1/2 text-center border-r border-dashed border-gray-400">Max</div><div className="w-1/2 text-center">Min</div></div>
                    <div className="flex flex-1 mt-1"><input type="text" className="w-1/2 text-center text-sm focus:outline-none border-r border-dashed border-gray-400 bg-transparent" value={env?.tempMax || ''} onChange={e => setEnv && setEnv({...env, tempMax: e.target.value})} /><input type="text" className="w-1/2 text-center text-sm focus:outline-none bg-transparent" value={env?.tempMin || ''} onChange={e => setEnv && setEnv({...env, tempMin: e.target.value})} /></div>
                  </div>
                  <div className="w-1/2">
                    <div className="bg-[#002060] text-white text-center text-xs pb-1 font-bold">Humedad Relativa (%)</div>
                    <div className="flex border-t border-black bg-[#002060] text-white text-xs"><div className="w-1/2 text-center border-r border-dashed border-gray-400">Max</div><div className="w-1/2 text-center">Min</div></div>
                    <div className="flex flex-1 mt-1"><input type="text" className="w-1/2 text-center text-sm focus:outline-none border-r border-dashed border-gray-400 bg-transparent" value={env?.humMax || ''} onChange={e => setEnv && setEnv({...env, humMax: e.target.value})} /><input type="text" className="w-1/2 text-center text-sm focus:outline-none bg-transparent" value={env?.humMin || ''} onChange={e => setEnv && setEnv({...env, humMin: e.target.value})} /></div>
                  </div>
                </div>
              </div>
              <div className="border border-black flex flex-col bg-white">
                <div className="bg-[#002060] text-white text-center py-2 font-bold text-xs uppercase h-12 flex items-center justify-center">INCERTIDUMBRE DE MEDICIÓN</div>
                <div className="flex flex-col flex-1 justify-center px-4 text-xs">
                  <div className="flex justify-between border-b border-dotted border-gray-400 py-1"><span>Factor de cobertura "k"</span><input type="text" className="w-8 text-center focus:outline-none font-bold bg-transparent" value={env?.factorCobertura || ''} onChange={e => setEnv && setEnv({...env, factorCobertura: e.target.value})} /></div>
                  <div className="flex justify-between py-1"><span>Nivel de confianza</span><input type="text" className="w-10 text-center focus:outline-none font-bold bg-transparent" value={env?.confianza || ''} onChange={e => setEnv && setEnv({...env, confianza: e.target.value})} /></div>
                </div>
              </div>
            </div>
            {notasExtra}
          </div>
        );

        // --- COMPONENTE PRINCIPAL ---
        function App() {
          const [activeTab, setActiveTab] = useState('portada');
          const [reportCode, setReportCode] = useState('R26-0001');

          const [globalCounter, setGlobalCounter] = useState(17);

          const [equipos, setEquipos] = useState([
            { id: 1, nombre: 'Elevador de tensión' },
            { id: 2, nombre: 'Multímetro calibrado' }
          ]);

          const defaultEnv = { fechaEjecucion: '2026-', tempMax: '', tempMin: '', humMax: '', humMin: '', factorCobertura: '2', confianza: '95%' };
          const [envConditions, setEnvConditions] = useState({...defaultEnv});
          const [alfombrasConditions, setAlfombrasConditions] = useState({...defaultEnv});
          const [mantasConditions, setMantasConditions] = useState({...defaultEnv});
          const [jumpersConditions, setJumpersConditions] = useState({...defaultEnv});
          const [manguerasConditions, setManguerasConditions] = useState({...defaultEnv});
          const [cubiertasConditions, setCubiertasConditions] = useState({...defaultEnv});
          const [calzadoConditions, setCalzadoConditions] = useState({...defaultEnv});
          const [tubosConditions, setTubosConditions] = useState({...defaultEnv, tempInicial: '20.1', acondicionamiento: 'Si'}); 
          const [guantesConditions, setGuantesConditions] = useState({...defaultEnv});
          const [herramientasConditions, setHerramientasConditions] = useState({...defaultEnv});
          const [cascosConditions, setCascosConditions] = useState({...defaultEnv});
          const [plataformasConditions, setPlataformasConditions] = useState({...defaultEnv});
          const [tierrasConditions, setTierrasConditions] = useState({...defaultEnv});
          const [detectoresConditions, setDetectoresConditions] = useState({...defaultEnv});
          const [vehiculosConditions, setVehiculosConditions] = useState({...defaultEnv});
          const [linersConditions, setLinersConditions] = useState({...defaultEnv});

          const [itemsMangas, setItemsMangas] = useState([{ idConsecutivo: '001', idCliente: '', descripcion: 'MANGA DIELÉCTRICA', fabricante: '', clase: '2', inspeccionVisual: 'Pasa', tensionAplicada: '', incertidumbre: '', disrupcion: 'No', cumple: 'PASA' }]);
          const [itemsAlfombras, setItemsAlfombras] = useState([{ idConsecutivo: '002', idExterna: '', elemento: 'TAPETE DIELÉCTRICO', fabricante: '', clase: '2', dimension: '', inspeccionVisual: 'PASA', tension: '', incertidumbre: '0.40', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);
          const [itemsMantas, setItemsMantas] = useState([{ idConsecutivo: '003', idExterna: '', elemento: 'MANTA DIELÉCTRICA', fabricante: '', clase: '4', dimension: '', inspeccionVisual: 'PASA', tension: '', incertidumbre: '0.40', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);
          const [itemsJumpers, setItemsJumpers] = useState([{ idConsecutivo: '004', idExterna: '', elemento: 'JUMPER DIELÉCTRICO', fabricante: '', clasificacion: '15', inspeccionVisual: 'PASA', tension: '', incertidumbre: '0.21', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);
          const [itemsMangueras, setItemsMangueras] = useState([{ idConsecutivo: '005', idExterna: '', elemento: 'MANGUERA CON CONECTOR', fabricante: '', clase: '4', dimension: '137', inspeccionVisual: 'PASA', tension: '', incertidumbre: '0.40', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);
          const [itemsCubiertas, setItemsCubiertas] = useState([{ idConsecutivo: '006', idExterna: '', elemento: 'CUBIERTA PLÁSTICA', fabricante: '', clase: '6', dimension: '150', inspeccionVisual: 'PASA', tension: '', incertidumbre: '0.40', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);
          const [itemsCalzado, setItemsCalzado] = useState([{ idConsecutivo: '007', idExterna: '', elemento: 'BOTA DIELÉCTRICA', fabricante: 'novax', clase: '2', talla: '40', inspeccionVisual: 'PASA', tension: '39.6', incertidumbre: '0.40', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);
          const [itemsTubos, setItemsTubos] = useState([{ idConsecutivo: '008', idExterna: '', elemento: 'PÉRTIGA ESCOPETA', fabricante: 'HASTINGS', inspeccionVisual: 'PASA', tension: '100.1', incertidumbre: '1.2', disrupcion: 'NO PRESENTA', tempFinal: '20.4', incrementoTemp: 'NO PRESENTA', cumple: 'PASA' }]);
          const [itemsGuantes, setItemsGuantes] = useState([{ idConsecutivo: '009', idExterna: '', elemento: 'GUANTE DIELÉCTRICO DERECHO', fabricante: 'novax', clase: '4', dimension: '41', inspeccionVisual: 'PASA', tension: '39.6', corriente: '12.45', incCorriente: '0.34', maxCorriente: '22', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);
          const [itemsHerramientas, setItemsHerramientas] = useState([{ idConsecutivo: '010', idExterna: '', elemento: 'LLAVE RACHE AISLADA', fabricante: 'TOOLS', l1: '0.30', l2: '0.30', inspeccionVisual: 'PASA', tension: '9.9', corriente: '1.50', incCorriente: '0.081', maxCorriente: '3', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);
          const [itemsCascos, setItemsCascos] = useState([{ idConsecutivo: '011', idExterna: '', elemento: 'CASCO DIELÉCTRICO', fabricante: 'MANDACA', clase: 'E', talla: 'S', inspeccionVisual: 'PASA', tension: '19.3', corriente: '5.89', incCorriente: '0.20', maxCorriente: '9', disrupcion: 'NO PRESENTA', observaciones: '', cumple: 'PASA' }]);
          const [itemsPlataformas, setItemsPlataformas] = useState([{ idConsecutivo: '012', idExterna: '', elemento: 'PLATAFORMA AISLANTE', fabricante: 'CHANCE', dimension: '60', inspeccionVisual: 'PASA', puntos: '1 - 4', tension: '29.5', corriente: '109.85', incCorriente: '2.30', maxCorriente: '150', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);
          const [itemsTierras, setItemsTierras] = useState([{ idConsecutivo: '013', idExterna: '', elemento: 'PUENTE TIERRA TRAMO 1', fabricante: 'FUSSAND', calibre: '25', longitud: '6.00', inspeccionVisual: 'PASA', continuidad: 'EFICIENTE', resistenciaMedida: '4.299', incResistencia: '0.0300', resistenciaMax: '4.667', cumple: 'PASA' }]);
          const [itemsDetectores, setItemsDetectores] = useState([{ idConsecutivo: '014', idExterna: '', elemento: 'DETECTOR DE TENSIÓN', fabricante: 'RITZ', tensionOperacion: '11.4 - 34.5', inspeccionVisual: 'PASA', tensionPrueba: '40.0', distancia: '0.30', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);
          const [itemsVehiculos, setItemsVehiculos] = useState([{ idConsecutivo: '015', idExterna: '', elemento: 'VEHÍCULO BRAZO AISLADO', fabricante: 'ALTEC', categoria: 'C', inspeccionVisual: 'PASA', tension: '46.0', corriente: '0.85', incCorriente: '0.02', maxCorriente: '1.0', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);
          const [itemsLiners, setItemsLiners] = useState([{ idConsecutivo: '016', idExterna: '', elemento: 'VASO LINER / CANASTILLA', fabricante: 'TEREX', clase: '10', inspeccionVisual: 'PASA', tension: '10.0', corriente: '0.45', incCorriente: '0.01', maxCorriente: '1.0', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);

          const getNextId = () => {
            const id = globalCounter.toString().padStart(3, '0');
            setGlobalCounter(prev => prev + 1);
            return id;
          };

          const updateItem = (items, setItems, index, field, value, failCondition, successCondition) => {
            const newItems = [...items];
            newItems[index][field] = value;
            if (field === 'disrupcion' && value === failCondition) newItems[index]['cumple'] = 'NO PASA';
            else if (field === 'disrupcion' && value === successCondition && (newItems[index]['inspeccionVisual'] === 'Pasa' || newItems[index]['inspeccionVisual'] === 'PASA')) newItems[index]['cumple'] = 'PASA';
            else if (field === 'inspeccionVisual' && (value === 'No Pasa' || value === 'NO PASA')) newItems[index]['cumple'] = 'NO PASA';
            setItems(newItems);
          };
          
          const removeItem = (items, setItems, index) => { const newItems = [...items]; newItems.splice(index, 1); setItems(newItems); };

          const handleItemChange = (index, field, value) => updateItem(itemsMangas, setItemsMangas, index, field, value, 'Sí', 'No');
          const addItem = () => setItemsMangas([...itemsMangas, { idConsecutivo: getNextId(), idCliente: '', descripcion: '', fabricante: '', clase: '', inspeccionVisual: 'Pasa', tensionAplicada: '', incertidumbre: '', disrupcion: 'No', cumple: 'PASA' }]);
          
          const handleAlfombraChange = (index, field, value) => updateItem(itemsAlfombras, setItemsAlfombras, index, field, value, 'PRESENTA', 'NO PRESENTA');
          const addItemAlfombra = () => setItemsAlfombras([...itemsAlfombras, { idConsecutivo: getNextId(), idExterna: '', elemento: 'TAPETE DIELÉCTRICO', fabricante: '', clase: '', dimension: '', inspeccionVisual: 'PASA', tension: '', incertidumbre: '0.40', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);
          
          const handleMantaChange = (index, field, value) => updateItem(itemsMantas, setItemsMantas, index, field, value, 'PRESENTA', 'NO PRESENTA');
          const addItemManta = () => setItemsMantas([...itemsMantas, { idConsecutivo: getNextId(), idExterna: '', elemento: 'MANTA DIELÉCTRICA', fabricante: '', clase: '', dimension: '', inspeccionVisual: 'PASA', tension: '', incertidumbre: '0.40', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);
          
          const handleJumperChange = (index, field, value) => updateItem(itemsJumpers, setItemsJumpers, index, field, value, 'PRESENTA', 'NO PRESENTA');
          const addItemJumper = () => setItemsJumpers([...itemsJumpers, { idConsecutivo: getNextId(), idExterna: '', elemento: 'JUMPER DIELÉCTRICO', fabricante: '', clasificacion: '15', inspeccionVisual: 'PASA', tension: '', incertidumbre: '0.21', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);
          
          const handleMangueraChange = (index, field, value) => updateItem(itemsMangueras, setItemsMangueras, index, field, value, 'PRESENTA', 'NO PRESENTA');
          const addItemManguera = () => setItemsMangueras([...itemsMangueras, { idConsecutivo: getNextId(), idExterna: '', elemento: 'MANGUERA CON CONECTOR', fabricante: '', clase: '4', dimension: '137', inspeccionVisual: 'PASA', tension: '', incertidumbre: '0.40', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);
          
          const handleCubiertaChange = (index, field, value) => updateItem(itemsCubiertas, setItemsCubiertas, index, field, value, 'PRESENTA', 'NO PRESENTA');
          const addItemCubierta = () => setItemsCubiertas([...itemsCubiertas, { idConsecutivo: getNextId(), idExterna: '', elemento: 'CUBIERTA PLÁSTICA', fabricante: '', clase: '6', dimension: '150', inspeccionVisual: 'PASA', tension: '', incertidumbre: '0.40', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);
          
          const handleCalzadoChange = (index, field, value) => updateItem(itemsCalzado, setItemsCalzado, index, field, value, 'PRESENTA', 'NO PRESENTA');
          const addItemCalzado = () => setItemsCalzado([...itemsCalzado, { idConsecutivo: getNextId(), idExterna: '', elemento: 'BOTA DIELÉCTRICA', fabricante: 'novax', clase: '2', talla: '40', inspeccionVisual: 'PASA', tension: '39.6', incertidumbre: '0.40', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);
          
          const handleTuboChange = (index, field, value) => {
            const newItems = [...itemsTubos];
            newItems[index][field] = value;
            const disp = field === 'disrupcion' ? value : newItems[index].disrupcion;
            const incr = field === 'incrementoTemp' ? value : newItems[index].incrementoTemp;
            const insp = field === 'inspeccionVisual' ? value : newItems[index].inspeccionVisual;
            if (disp === 'PRESENTA' || incr === 'PRESENTA' || insp === 'NO PASA') newItems[index]['cumple'] = 'NO PASA';
            else newItems[index]['cumple'] = 'PASA';
            setItemsTubos(newItems);
          };
          const addItemTubo = () => setItemsTubos([...itemsTubos, { idConsecutivo: getNextId(), idExterna: '', elemento: 'PÉRTIGA ESCOPETA', fabricante: 'HASTINGS', inspeccionVisual: 'PASA', tension: '100.1', incertidumbre: '1.2', disrupcion: 'NO PRESENTA', tempFinal: '20.4', incrementoTemp: 'NO PRESENTA', cumple: 'PASA' }]);
          
          const checkCurrentLimit = (items, setItems, index, field, value) => {
            const newItems = [...items];
            newItems[index][field] = value;
            const { disrupcion, inspeccionVisual, corriente, maxCorriente } = newItems[index];
            if (disrupcion === 'PRESENTA' || inspeccionVisual === 'NO PASA' || parseFloat(corriente) > parseFloat(maxCorriente)) newItems[index]['cumple'] = 'NO PASA';
            else newItems[index]['cumple'] = 'PASA';
            setItems(newItems);
          };
          
          const handleGuanteChange = (index, field, value) => checkCurrentLimit(itemsGuantes, setItemsGuantes, index, field, value);
          const addItemGuante = () => setItemsGuantes([...itemsGuantes, { idConsecutivo: getNextId(), idExterna: '', elemento: 'GUANTE DIELÉCTRICO DERECHO', fabricante: 'novax', clase: '4', dimension: '41', inspeccionVisual: 'PASA', tension: '39.6', corriente: '12.45', incCorriente: '0.34', maxCorriente: '22', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);
          
          const handleHerramientaChange = (index, field, value) => checkCurrentLimit(itemsHerramientas, setItemsHerramientas, index, field, value);
          const addItemHerramienta = () => setItemsHerramientas([...itemsHerramientas, { idConsecutivo: getNextId(), idExterna: '', elemento: 'LLAVE RACHE AISLADA', fabricante: 'TOOLS', l1: '0.30', l2: '0.30', inspeccionVisual: 'PASA', tension: '9.9', corriente: '1.50', incCorriente: '0.081', maxCorriente: '3', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);

          const handleCascoChange = (index, field, value) => checkCurrentLimit(itemsCascos, setItemsCascos, index, field, value);
          const addItemCasco = () => setItemsCascos([...itemsCascos, { idConsecutivo: getNextId(), idExterna: '', elemento: 'CASCO DIELÉCTRICO', fabricante: 'MANDACA', clase: 'E', talla: 'S', inspeccionVisual: 'PASA', tension: '19.3', corriente: '5.89', incCorriente: '0.20', maxCorriente: '9', disrupcion: 'NO PRESENTA', observaciones: '', cumple: 'PASA' }]);

          const handlePlataformaChange = (index, field, value) => checkCurrentLimit(itemsPlataformas, setItemsPlataformas, index, field, value);
          const addItemPlataforma = () => setItemsPlataformas([...itemsPlataformas, { idConsecutivo: getNextId(), idExterna: '', elemento: 'PLATAFORMA AISLANTE', fabricante: 'CHANCE', dimension: '60', inspeccionVisual: 'PASA', puntos: '1 - 4', tension: '29.5', corriente: '109.85', incCorriente: '2.30', maxCorriente: '150', disrupcion: 'NO PRESENTA', cumple: 'PASA' }]);

          const handleTierraChange = (index, field, value) => {
            const newItems = [...itemsTierras];
            newItems[index][field] = value;
            const { inspeccionVisual: insp, continuidad: cont, resistenciaMedida: rMedida, resistenciaMax: rMax } = newItems[index];
            if (insp === 'NO PASA' || cont === 'NO EFICIENTE') newItems[index]['cumple'] = 'NO PASA';
            else if (rMedida && rMax && parseFloat(rMedida) > parseFloat(rMax)) newItems[index]['cumple'] = 'NO PASA';
            else newItems[index]['cumple'] = 'PASA';
            setItemsTierras(newItems);
          };

                      <TopSection reportCode={reportCode} tituloEnsayo="Rigidez dieléctrica - Detectores de tensión" normativa="IEC 61243-1: 2021" numNormativa="Numerales 6.2.2.3, 6.2.2.4" reglas={["Regla de decisión (Simple): La conformidad se declara aplicando una regla de decisión simple.", "- Cumple: si soporta la tensión de ensayo sin presentar disrupción dieléctrica, flashover, chispa o punzamiento.", "- No Cumple: si presenta disrupción dieléctrica, flashover, chispa o punzamiento."]} env={detectoresConditions} setEnv={setDetectoresConditions} notasExtra={<div className="mt-2 mb-2"><div className="border border-dashed border-black inline-block p-2 text-xs bg-white shadow-sm"><span className="font-bold">Nota:</span> Si la inspección resulta en NO Pasa, diríjase a los anexos para consultar la causa de rechazo.</div></div>} />
                      <table className="w-full text-xs text-center border-collapse bg-white">
                        <thead>
                          <tr className="bg-[#b4c6e7] font-bold border-t-2 border-l-2 border-r-2 border-black">
                            <th colSpan="2" className="border border-black px-2 py-1">IDENTIFICACIÓN</th><th colSpan="3" className="border border-black border-l-2 border-dashed px-2 py-1">INFO CLIENTE</th><th colSpan="4" className="border border-black border-l-2 border-dashed px-2 py-1">RESULTADO ENSAYO</th><th colSpan="1" className="border border-black border-l-2 border-dashed px-2 py-1">CONFORMIDAD</th><th className="border border-black print:hidden">X</th>
                          </tr>
                          <tr className="bg-[#b4c6e7] font-bold border-l-2 border-r-2 border-black">
                            <th className="border border-black px-1 py-1 w-20">Interna</th><th className="border border-black px-1 py-1 w-20">Externa</th>
                            <th className="border border-black border-l-2 border-dashed px-1 py-1 w-32">Elemento</th><th className="border border-black px-1 py-1 w-24">Fabricante</th><th className="border border-black px-1 py-1 w-24">Tensión Op. (kV)</th>
                            <th className="border border-black border-l-2 border-dashed px-1 py-1 w-20">Inspección Visual</th><th className="border border-black px-1 py-1 w-20">Tensión Prueba (kV)</th><th className="border border-black px-1 py-1 w-20">Distancia (m)</th><th className="border border-black px-1 py-1 w-20">Disrupción</th>
                            <th className="border border-black border-l-2 border-dashed px-1 py-1 w-20">Cumple</th><th className="border border-black print:hidden w-10">Del</th>
                          </tr>
                        </thead>
                        <tbody className="border-l-2 border-r-2 border-b-2 border-black">
                          {itemsDetectores.map((item, index) => (
                            <tr key={item.idConsecutivo} className={`border-b border-black ${item.cumple === 'NO PASA' ? 'bg-[#d9d9d9]' : 'bg-white'}`}>
                              <td className="border border-black px-1 py-2 font-mono">{reportCode}-{item.idConsecutivo}</td>
                              <td className="border border-black px-1 py-2"><input type="text" className="w-full text-center bg-transparent focus:outline-none" value={item.idExterna} onChange={(e) => handleDetectorChange(index, 'idExterna', e.target.value)} /></td>
                              <td className="border border-black border-l-2 border-dashed px-1 py-2 uppercase"><input type="text" className="w-full text-center bg-transparent focus:outline-none uppercase" value={item.elemento} onChange={(e) => handleDetectorChange(index, 'elemento', e.target.value)} /></td>
                              <td className="border border-black px-1 py-2 uppercase"><input type="text" className="w-full text-center bg-transparent focus:outline-none uppercase" value={item.fabricante} onChange={(e) => handleDetectorChange(index, 'fabricante', e.target.value)} /></td>
                              <td className="border border-black px-1 py-2"><input type="text" className="w-full text-center bg-transparent focus:outline-none uppercase" value={item.tensionOperacion} onChange={(e) => handleDetectorChange(index, 'tensionOperacion', e.target.value)} /></td>
                              <td className="border border-black border-l-2 border-dashed px-1 py-2"><select className="w-full text-center bg-transparent focus:outline-none font-bold" value={item.inspeccionVisual} onChange={(e) => handleDetectorChange(index, 'inspeccionVisual', e.target.value)}><option value="PASA">PASA</option><option value="NO PASA">NO PASA</option></select></td>
                              <td className="border border-black px-1 py-2"><input type="number" step="0.1" className="w-full text-center bg-transparent focus:outline-none" value={item.tensionPrueba} onChange={(e) => handleDetectorChange(index, 'tensionPrueba', e.target.value)} /></td>
                              <td className="border border-black px-1 py-2"><input type="number" step="0.01" className="w-full text-center bg-transparent focus:outline-none" value={item.distancia} onChange={(e) => handleDetectorChange(index, 'distancia', e.target.value)} /></td>
                              <td className="border border-black px-1 py-2"><select className={`w-full text-center focus:outline-none font-bold ${item.disrupcion==='PRESENTA'?'text-red-700':'text-green-700'}`} value={item.disrupcion} onChange={(e) => handleDetectorChange(index, 'disrupcion', e.target.value)}><option>NO PRESENTA</option><option>PRESENTA</option></select></td>
                              <td className="border border-black border-l-2 border-dashed px-1 py-2"><div className={`text-center font-bold px-2 py-1 rounded text-xs uppercase ${item.cumple === 'PASA' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>{item.cumple}</div></td>
                              <td className="border border-black px-1 py-2 text-center bg-white print:hidden"><button onClick={() => removeItem(itemsDetectores, setItemsDetectores, index)} className="text-white bg-red-600 px-2 py-1 rounded font-bold">X</button></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      <div className="flex justify-end mt-2 print:hidden"><button onClick={addItemDetector} className="bg-[#002060] hover:bg-blue-800 text-white px-4 py-2 rounded font-bold text-sm">+ Añadir fila</button></div>
                    </React.Fragment>
                  )}

                  {/* --- VEHÍCULOS --- */}
                  {activeTab === 'vehiculos' && (
                    <React.Fragment>
                      <TopSection reportCode={reportCode} tituloEnsayo="Medición de corriente de fuga - Vehículos brazo aislado." normativa="ANSI/SIA A92.2 - 2021" numNormativa="Numerales 5.4.2 y 5.4.3" reglas={["Regla de decisión (Simple): La conformidad se declara aplicando una regla de decisión simple en donde se establece el criterio de aceptación y/o rechazo:", "- Cumple: si el vehículo soporta la tensión durante el tiempo estipulado sin disrupción y la corriente de fuga no excede el límite máximo especificado.", "- No Cumple: si presenta disrupción o la corriente de fuga excede el límite."]} env={vehiculosConditions} setEnv={setVehiculosConditions} notasExtra={<div className="mt-2 mb-2"><div className="border border-dashed border-black inline-block p-2 text-xs bg-white shadow-sm"><span className="font-bold">Nota:</span> Si la inspección resulta en NO Pasa, diríjase a los anexos para consultar la causa de rechazo.</div></div>} />
                      <table className="w-full text-xs text-center border-collapse bg-white">
                        <thead>
                          <tr className="bg-[#b4c6e7] font-bold border-t-2 border-l-2 border-r-2 border-black">
                            <th colSpan="2" className="border border-black px-2 py-1">IDENTIFICACIÓN</th><th colSpan="3" className="border border-black border-l-2 border-dashed px-2 py-1">INFO CLIENTE</th><th colSpan="6" className="border border-black border-l-2 border-dashed px-2 py-1">RESULTADO ENSAYO</th><th colSpan="1" className="border border-black border-l-2 border-dashed px-2 py-1">CONFORMIDAD</th><th className="border border-black print:hidden">X</th>
                          </tr>
                          <tr className="bg-[#b4c6e7] font-bold border-l-2 border-r-2 border-black">
                            <th className="border border-black px-1 py-1 w-20">Interna</th><th className="border border-black px-1 py-1 w-20">Externa</th>
                            <th className="border border-black border-l-2 border-dashed px-1 py-1 w-32">Elemento</th><th className="border border-black px-1 py-1 w-24">Fabricante</th><th className="border border-black px-1 py-1 w-16">Categoría</th>
                            <th className="border border-black border-l-2 border-dashed px-1 py-1 w-20">Inspección Visual</th><th className="border border-black px-1 py-1 w-16">Tensión (kV)</th><th className="border border-black px-1 py-1 w-16">Corr. (mA)</th><th className="border border-black px-1 py-1 w-16">Incert.</th><th className="border border-black px-1 py-1 w-16">Max Corr.</th><th className="border border-black px-1 py-1 w-20">Disrupción</th>
                            <th className="border border-black border-l-2 border-dashed px-1 py-1 w-20">Cumple</th><th className="border border-black print:hidden w-10">Del</th>
                          </tr>
                        </thead>
                        <tbody className="border-l-2 border-r-2 border-b-2 border-black">
                          {itemsVehiculos.map((item, index) => (
                            <tr key={item.idConsecutivo} className={`border-b border-black ${item.cumple === 'NO PASA' ? 'bg-[#d9d9d9]' : 'bg-white'}`}>
                              <td className="border border-black px-1 py-2 font-mono">{reportCode}-{item.idConsecutivo}</td>
                              <td className="border border-black px-1 py-2"><input type="text" className="w-full text-center bg-transparent focus:outline-none" value={item.idExterna} onChange={(e) => handleVehiculoChange(index, 'idExterna', e.target.value)} /></td>
                              <td className="border border-black border-l-2 border-dashed px-1 py-2"><input type="text" className="w-full text-center bg-transparent focus:outline-none uppercase" value={item.elemento} onChange={(e) => handleVehiculoChange(index, 'elemento', e.target.value)} /></td>
                              <td className="border border-black px-1 py-2"><input type="text" className="w-full text-center bg-transparent focus:outline-none uppercase" value={item.fabricante} onChange={(e) => handleVehiculoChange(index, 'fabricante', e.target.value)} /></td>
                              <td className="border border-black px-1 py-2"><select className="w-full text-center bg-transparent focus:outline-none font-bold" value={item.categoria} onChange={(e) => handleVehiculoChange(index, 'categoria', e.target.value)}><option value="A">A</option><option value="B">B</option><option value="C">C</option></select></td>
                              <td className="border border-black border-l-2 border-dashed px-1 py-2"><select className="w-full text-center bg-transparent focus:outline-none font-bold" value={item.inspeccionVisual} onChange={(e) => handleVehiculoChange(index, 'inspeccionVisual', e.target.value)}><option>PASA</option><option>NO PASA</option></select></td>
                              <td className="border border-black px-1 py-2"><input type="number" className="w-full text-center bg-transparent focus:outline-none" value={item.tension} onChange={(e) => handleVehiculoChange(index, 'tension', e.target.value)} /></td>
                              <td className="border border-black px-1 py-2"><input type="number" step="0.01" className="w-full text-center bg-transparent focus:outline-none font-bold text-blue-700" value={item.corriente} onChange={(e) => handleVehiculoChange(index, 'corriente', e.target.value)} /></td>
                              <td className="border border-black px-1 py-2"><input type="number" step="0.01" className="w-full text-center bg-transparent focus:outline-none" value={item.incCorriente} onChange={(e) => handleVehiculoChange(index, 'incCorriente', e.target.value)} /></td>
                              <td className="border border-black px-1 py-2"><input type="number" step="0.1" className="w-full text-center bg-transparent focus:outline-none font-bold text-red-700" value={item.maxCorriente} onChange={(e) => handleVehiculoChange(index, 'maxCorriente', e.target.value)} /></td>
                              <td className="border border-black px-1 py-2"><select className={`w-full text-center focus:outline-none font-bold ${item.disrupcion==='PRESENTA'?'text-red-700':'text-green-700'}`} value={item.disrupcion} onChange={(e) => handleVehiculoChange(index, 'disrupcion', e.target.value)}><option>NO PRESENTA</option><option>PRESENTA</option></select></td>
                              <td className="border border-black border-l-2 border-dashed px-1 py-2 font-bold uppercase"><div className={`text-center font-bold px-2 py-1 rounded text-xs uppercase ${item.cumple === 'PASA' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>{item.cumple}</div></td>
                              <td className="border border-black px-1 py-2 text-center bg-white print:hidden"><button onClick={() => removeItem(itemsVehiculos, setItemsVehiculos, index)} className="text-white bg-red-600 px-2 py-1 rounded font-bold">X</button></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      <div className="flex justify-end mt-2 print:hidden"><button onClick={addItemVehiculo} className="bg-[#002060] hover:bg-blue-800 text-white px-4 py-2 font-bold rounded text-sm">+ Añadir fila</button></div>
                    </React.Fragment>
                  )}

                  {/* --- LINERS --- */}
                  {activeTab === 'liners' && (
                    <React.Fragment>
                      <TopSection reportCode={reportCode} tituloEnsayo="Ensayos de Vaso Liner (Herramienta aislada)" normativa="IEC 60900:2018" numNormativa="Numeral 5.5.3 (Ensayo de aislamiento dieléctrico)" reglas={["La conformidad se declara cuando el aislamiento dieléctrico del Vaso Liner soporta la aplicación de la tensión de prueba de 10 kV durante 3 minutos sin presentar corrientes de fuga superiores a 1.0 mA.", "Criterio de Aceptación: Corriente de fuga ≤ 1.0 mA y ausencia de perforación o arqueo."]} env={linersConditions} setEnv={setLinersConditions} notasExtra={<div className="mt-2 mb-2"><div className="border border-dashed border-black inline-block p-2 text-xs bg-white shadow-sm"><span className="font-bold">Nota:</span> Si la inspección resulta en NO Pasa, diríjase a los anexos para consultar la causa de rechazo.</div></div>} />
                      <table className="w-full text-xs text-center border-collapse bg-white">
                        <thead>
                          <tr className="bg-[#b4c6e7] font-bold border-t-2 border-l-2 border-r-2 border-black">
                            <th colSpan="2" className="border border-black px-2 py-1">IDENTIFICACIÓN</th><th colSpan="2" className="border border-black border-l-2 border-dashed px-2 py-1">INFO CLIENTE</th><th colSpan="6" className="border border-black border-l-2 border-dashed px-2 py-1">RESULTADO ENSAYO</th><th colSpan="1" className="border border-black border-l-2 border-dashed px-2 py-1">CONFORMIDAD</th><th className="border border-black print:hidden">X</th>
                          </tr>
                          <tr className="bg-[#b4c6e7] font-bold border-l-2 border-r-2 border-black">
                            <th className="border border-black px-1 py-1 w-20">Interna</th><th className="border border-black px-1 py-1 w-20">Externa</th>
                            <th className="border border-black border-l-2 border-dashed px-1 py-1 w-32">Elemento</th><th className="border border-black px-1 py-1 w-24">Fabricante</th>
                            <th className="border border-black border-l-2 border-dashed px-1 py-1 w-20">Inspección Visual</th><th className="border border-black px-1 py-1 w-16">Tensión (kV)</th><th className="border border-black px-1 py-1 w-16">Corr. (mA)</th><th className="border border-black px-1 py-1 w-16">Incert.</th><th className="border border-black px-1 py-1 w-16">Max Corr.</th><th className="border border-black px-1 py-1 w-20">Disrupción</th>
                            <th className="border border-black border-l-2 border-dashed px-1 py-1 w-20">Cumple</th><th className="border border-black print:hidden w-10">Del</th>
                          </tr>
                        </thead>
                        <tbody className="border-l-2 border-r-2 border-b-2 border-black">
                          {itemsLiners.map((item, index) => (
                            <tr key={item.idConsecutivo} className={`border-b border-black ${item.cumple === 'NO PASA' ? 'bg-[#d9d9d9]' : 'bg-white'}`}>
                              <td className="border border-black px-1 py-2 font-mono">{reportCode}-{item.idConsecutivo}</td>
                              <td className="border border-black px-1 py-2"><input type="text" className="w-full text-center bg-transparent focus:outline-none" value={item.idExterna} onChange={(e) => handleLinerChange(index, 'idExterna', e.target.value)} /></td>
                              <td className="border border-black border-l-2 border-dashed px-1 py-2"><input type="text" className="w-full text-center bg-transparent focus:outline-none uppercase" value={item.elemento} onChange={(e) => handleLinerChange(index, 'elemento', e.target.value)} /></td>
                              <td className="border border-black px-1 py-2"><input type="text" className="w-full text-center bg-transparent focus:outline-none uppercase" value={item.fabricante} onChange={(e) => handleLinerChange(index, 'fabricante', e.target.value)} /></td>
                              <td className="border border-black border-l-2 border-dashed px-1 py-2"><select className="w-full text-center bg-transparent focus:outline-none font-bold" value={item.inspeccionVisual} onChange={(e) => handleLinerChange(index, 'inspeccionVisual', e.target.value)}><option>PASA</option><option>NO PASA</option></select></td>
                              <td className="border border-black px-1 py-2"><input type="number" className="w-full text-center bg-transparent focus:outline-none" value={item.tension} onChange={(e) => handleLinerChange(index, 'tension', e.target.value)} /></td>
                              <td className="border border-black px-1 py-2"><input type="number" step="0.01" className="w-full text-center bg-transparent focus:outline-none font-bold text-blue-700" value={item.corriente} onChange={(e) => handleLinerChange(index, 'corriente', e.target.value)} /></td>
                              <td className="border border-black px-1 py-2"><input type="number" step="0.01" className="w-full text-center bg-transparent focus:outline-none" value={item.incCorriente} onChange={(e) => handleLinerChange(index, 'incCorriente', e.target.value)} /></td>
                              <td className="border border-black px-1 py-2"><input type="number" step="0.1" className="w-full text-center bg-transparent focus:outline-none font-bold text-red-700" value={item.maxCorriente} onChange={(e) => handleLinerChange(index, 'maxCorriente', e.target.value)} /></td>
                              <td className="border border-black px-1 py-2"><select className={`w-full text-center focus:outline-none font-bold ${item.disrupcion==='PRESENTA'?'text-red-700':'text-green-700'}`} value={item.disrupcion} onChange={(e) => handleLinerChange(index, 'disrupcion', e.target.value)}><option>NO PRESENTA</option><option>PRESENTA</option></select></td>
                              <td className="border border-black border-l-2 border-dashed px-1 py-2 font-bold uppercase"><div className={`text-center font-bold px-2 py-1 rounded text-xs uppercase ${item.cumple === 'PASA' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>{item.cumple}</div></td>
                              <td className="border border-black px-1 py-2 text-center bg-white print:hidden"><button onClick={() => removeItem(itemsLiners, setItemsLiners, index)} className="text-white bg-red-600 px-2 py-1 rounded font-bold">X</button></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      <div className="flex justify-end mt-2 print:hidden"><button onClick={addItemLiner} className="bg-[#002060] hover:bg-blue-800 text-white px-4 py-2 font-bold rounded text-sm">+ Añadir fila</button></div>
                    </React.Fragment>
                  )}

                </div>
              </div>
            </div>
          );
        }

        // Renderizado inicial
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
